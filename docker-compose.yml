# HUT na Synology (Container Manager) nebo lokálně.
#
# 1) Zkopíruj .env.example → .env a doplň hodnoty z Supabase (Dashboard → Settings → API).
# 2) Soubor .env NIKDY necommituj — zůstane jen na NAS / u tebe lokálně.
# 3) Build bere NEXT_PUBLIC_* z .env (po změně těchto klíčů znovu build).
#    Git SHA se do image vloží sám z .git (i při `sudo docker compose build` bez env):
#      sudo docker compose build
#      sudo docker compose up -d
#    Ověř: curl -s https://hut.gibonart.cz/api/version
#
# Port: aplikace uvnitř kontejneru poslouchá na 3000. Níže mapuješ host:container.
# Na Synology v DSM často nastavíš Reverse Proxy z 443 na http://127.0.0.1:3000 (nebo jiný host port).

services:
  hut:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SUPABASE_NHL27_URL: ${NEXT_PUBLIC_SUPABASE_NHL27_URL}
        NEXT_PUBLIC_SUPABASE_NHL27_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_NHL27_ANON_KEY}
        NEXT_PUBLIC_SUPABASE_NHL27_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_NHL27_PUBLISHABLE_KEY}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_APP_GIT_SHA: ${NEXT_PUBLIC_APP_GIT_SHA:-}
        NEXT_PUBLIC_APP_BUILT_AT: ${NEXT_PUBLIC_APP_BUILT_AT:-}
    image: hut:latest
    container_name: hut
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HUT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    # Hairpin: hut v Dockeru volá veřejné HTTPS domény Supabase → mapuj na host NAS
    # (bez LAN IP v .env). host-gateway = IP docker hostu z pohledu kontejneru.
    extra_hosts:
      - "supabase.kc36gaming.gibonart.cz:host-gateway"
      - "supabase27.kc36gaming.gibonart.cz:host-gateway"
